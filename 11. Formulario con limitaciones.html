<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Limitaciones</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
    </style>
</head>
<body>
    <header>
        <h3>Limitaciones</h3>
    </header>
    <form>
        <label>Deshabilitado:</label>
        <input type="text" disabled value="No editable">
        <label>Máx. 5 caracteres:</label>
        <input type="password" maxlength="5">
        <label>Solo lectura:</label>
        <textarea readonly rows="2">Texto fijo</textarea>
    </form>
</body>
</html>
