<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Campos Ocultos</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
        button[type="submit"] { background: #6200ee; color: #fff; }
    </style>
</head>
<body>
    <header>
        <h3>Campos Ocultos</h3>
    </header>
    <form>
        <input type="hidden" name="hora" value="03:30">
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <div>
            <button type="submit">Enviar ✈</button>
            <button type="reset">Borrar 🗑</button>
        </div>
    </form>
</body>
</html>
