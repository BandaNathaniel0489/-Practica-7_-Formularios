<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Archivos</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
        button[type="submit"] { background: #6200ee; color: #fff; }
    </style>
</head>
<body>
    <header>
        <h3>Archivos</h3>
    </header>
    <form>
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <label>Archivo:</label>
        <input type="file" name="archivo">
        <div>
            <button type="submit">Enviar ✈</button>
            <button type="reset">Borrar 🗑</button>
        </div>
    </form>
</body>
</html>
