<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checkbox</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
    </style>
</head>
<body>
    <header>
        <h3>Checkbox</h3>
    </header>
    <form>
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <p style="color:#aaa;">Lenguajes:</p>
        <label><input type="checkbox" name="Java"> Java</label>
        <label><input type="checkbox" name="Python"> Python</label>
        <label><input type="checkbox" name="C#"> C#</label>
    </form>
</body>
</html>
