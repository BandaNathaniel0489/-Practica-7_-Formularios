<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contraseñas</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
        input[type="submit"] { background: #6200ee; color: #fff; }
    </style>
</head>
<body>
    <header>
        <h3>Contraseñas</h3>
    </header>
    <form>
        <label>Usuario:</label>
        <input type="text" name="usuario">
        <label>Contraseña:</label>
        <input type="password" name="pass">
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">
        </div>
    </form>
</body>
</html>
