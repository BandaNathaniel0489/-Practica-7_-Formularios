<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área de Texto</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
        input[type="submit"] { background: #6200ee; color: #fff; }
    </style>
</head>
<body>
    <header>
        <h3>Área de Texto</h3>
    </header>
    <form>
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <label>Correo:</label>
        <input type="email" name="correo">
        <label>Comentarios:</label>
        <textarea name="comentarios" rows="3"></textarea>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">
        </div>
    </form>
</body>
</html>
