<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radiobotón</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
        input[type="submit"] { background: #6200ee; color: #fff; }
    </style>
</head>
<body>
    <header>
        <h3>Radiobotón</h3>
    </header>
    <form>
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <p style="color:#aaa;">Estudios:</p>
        <label><input type="radio" name="estudios" value="1"> Primaria</label>
        <label><input type="radio" name="estudios" value="2"> Secundaria</label>
        <label><input type="radio" name="estudios" value="3"> Preparatoria</label>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">
        </div>
    </form>
</body>
</html>
