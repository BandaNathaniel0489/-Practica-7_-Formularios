<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Radiobotón</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
        }
        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
            font-size: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555555;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .radio-group {
            margin-bottom: 20px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            color: #333;
            cursor: pointer;
        }
        .radio-option input {
            margin-right: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        input[type="submit"], input[type="reset"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        input[type="reset"] {
            background-color: #6c757d;
            color: white;
        }
        input[type="reset"]:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Formularios con Radioboton</h2>
        <form action="" method="post">
            <label for="nombre">Ingresa tu nombre:</label>
            <input type="text" id="nombre" name="nombre">
            
            <label>Selecciona el máximo de estudios que tienes:</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="estudios" value="1"> Sin estudios</label>
                <label class="radio-option"><input type="radio" name="estudios" value="2"> Secundaria</label>
                <label class="radio-option"><input type="radio" name="estudios" value="3"> Primaria</label>
                <label class="radio-option"><input type="radio" name="estudios" value="4"> Preparatoria</label>
            </div>
            
            <div class="btn-group">
                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </div>
        </form>
    </div>

    <script>
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
    </script>
</body>
</html>
