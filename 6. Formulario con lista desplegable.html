<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selección</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3 { color: #bb86fc; }
        input[type="submit"] { background: #6200ee; color: #fff; }
    </style>
</head>
<body>
    <header>
        <h3>Selección</h3>
    </header>
    <form>
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <label>País:</label>
        <select name="pais">
            <option>México</option>
            <option>España</option>
            <option>Argentina</option>
            <option>Colombia</option>
        </select>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">
        </div>
    </form>
</body>
</html>
