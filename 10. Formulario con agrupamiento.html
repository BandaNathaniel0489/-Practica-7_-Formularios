<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agrupamiento</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; }
        form { background: #1e1e1e; padding: 20px; }
        h3, legend { color: #bb86fc; }
        button[type="submit"] { background: #6200ee; color: #fff; }
    </style>
</head>
<body>
    <header>
        <h3>Agrupamiento</h3>
    </header>
    <form>
        <fieldset>
            <legend>Datos Personales</legend>
            <label>Nombre:</label>
            <input type="text" name="nombre">
            <label>Fecha Nacimiento:</label>
            <input type="date" name="fecha">
        </fieldset>
        <fieldset>
            <legend>Datos Escolares</legend>
            <label>Escuela:</label>
            <input type="text" name="escuela">
        </fieldset>
        <div>
            <button type="submit">Enviar ✈</button>
            <button type="reset">Borrar 🗑</button>
        </div>
    </form>
</body>
</html>
